x-enrichment-notes: >-
  Contract discovery (STEP 0b) is what made this profile: effectphotonics.com/openapi.json,
  /swagger.json, /api-docs, /docs and /graphql all 404, but /wp-json/ returned a live 290-route
  WordPress discovery document whose namespaces include `mcp`, `wp-abilities/v1` and a first-party
  `effect/v1`. Deliberately absent, each a verified negative on 2026-08-12: AgentCard
  (/.well-known/agent-card.json and /.well-known/agent.json both 404, so nothing was written);
  SecurityTxt and Security (/.well-known/security.txt 404, no disclosure page, no bug bounty);
  TrustCenter (trust.effectphotonics.com answers a wildcard A record but fails TLS, curl exit 60);
  StatusPage (same wildcard/TLS failure on status.effectphotonics.com, no third-party status page);
  Deprecation (no policy, no RFC 8594 headers); Idempotency (no idempotency contract exists on this
  surface); SDKs and Packages (nothing first-party on npm, PyPI or any other registry, and no GitHub
  organisation under effectphotonics, effect-photonics or EffectPhotonics — all three 404 on the
  GitHub API); AsyncAPI and Webhooks (no event surface); ChangeLog (the newsroom is company news, not
  a change record); and Postman, Pricing, SignUp, Roadmap, Documentation, DeveloperPortal,
  APIReference, GettingStarted, CLI, Sandbox and Components. plans/ and rate-limits/ are written with
  plan_count 0 and limit_count 0 and are intentionally NOT wired as pointers, because a zero is a
  recorded absence, not a published surface. The Compliance pointer is the company's ISO 9001 quality
  certification announcement plus its published RoHS/REACH/IEC 60825-1 declarations — product
  compliance, not a security attestation. repair-api-bases.py reports `marketing-base-present` for
  this repo; it was reviewed and left alone, because the derived specs deliberately use the origin
  https://effectphotonics.com as servers[] with /wp-json carried in every path, so rewriting the base
  to https://effectphotonics.com/wp-json would double the prefix on all 439 operations.
