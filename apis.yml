aid: effect-photonics
name: EFFECT Photonics
description: >-
  EFFECT Photonics is an optical-semiconductor company headquartered at High Tech Campus 37 in
  Eindhoven, the Netherlands, with sites in the United Kingdom, the United States and Taiwan. Spun out
  of Eindhoven University of Technology, it designs and manufactures coherent optical transceiver
  subsystems and monolithically integrated Indium Phosphide (InP) photonic integrated circuits,
  including its pico and nano Integrable Tunable Laser Assemblies for 100G, 400G and 800G coherent
  links across telecom access and metro networks, data-center interconnect and AI scale-across
  infrastructure. It operates no developer API programme and publishes no product, network-management
  or transceiver-control API, no developer portal, no SDK and no pricing. It is catalogued here because
  its corporate website runs a live WordPress REST API with 290 discoverable routes — including a
  publicly readable optical-product catalogue with hardware taxonomies (product line, form factor,
  output power, tuning range, operating temperature, target application, management interface) and a
  first-party `effect/v1` namespace — and because that same install exposes two Model Context Protocol
  servers guarded by an OAuth 2.1 authorization server the host advertises through RFC 8414 and
  RFC 9728 metadata.
