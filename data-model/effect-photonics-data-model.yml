query_pattern:
  note: >-
    Taxonomy filtering uses term ids, not slugs — resolve the slug first, then filter. For example
    GET /wp-json/wp/v2/management_interface?slug=oif-itla-msa-01-3 returns term id 1380, then
    GET /wp-json/wp/v2/product?management_interface=1380 returns the matching products.
