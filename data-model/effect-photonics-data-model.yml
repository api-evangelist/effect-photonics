summary: >-
  The entity graph of the EFFECT Photonics WordPress install. Beyond WordPress core, the site models
  six first-party content types — product, career, event, partner, team and faq — and hangs seven
  optical-hardware taxonomies off `product`. That product/taxonomy cluster is the substantive part of
  this API: it is a machine-readable catalogue of coherent-optical laser assemblies keyed by output
  power, form factor, tuning range, operating temperature grade, target application and hardware
  management interface. Entity names, rest_bases and taxonomy bindings were read from the live type
  registry; term values were read from the live taxonomy collections. Counts are as observed on
  2026-08-12 and will drift.
id_scheme:
  style: integer
  note: >-
    Every entity is addressed by a WordPress integer post/term id, with a URL-safe `slug` as the
    stable human key. There are no typed id prefixes.
entities:
- name: product
  rest_base: product
  path: /wp-json/wp/v2/product
  public_read: true
  count_observed: 2
  description: >-
