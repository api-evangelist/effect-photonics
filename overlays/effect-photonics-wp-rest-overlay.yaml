- target: $.paths['/wp-json/wp/v2/product'].get
  update:
    x-apievangelist-use-case: >-
      The substantive public dataset on this API — the coherent optical laser assembly catalogue.
      Each product carries term-id references into seven hardware taxonomies (product_line,
      output_power, form_factor, tuning_range, target_application, temperature,
      management_interface). Resolve a taxonomy slug to its term id first, then filter products by
      that id; narrow the payload with _fields and inline terms with _embed.
- target: $.paths['/wp-json/wp/v2/faq'].get
  update:
    x-apievangelist-use-case: >-
      The only structured publication of this company's commercial and compliance terms — lead times
      (12–16 weeks for standard ITLA configurations), MOQ policy, incoterms (EXW default from the
      Netherlands), dual-use export control, RoHS/REACH declarations and IEC 60825-1 Class 1 laser
      safety. Category ids come from /wp-json/wp/v2/faq-category.
- target: $.paths['/wp-json/wp/v2/posts'].get
  update:
    x-apievangelist-use-case: >-
      The newsroom — press releases and technical insight articles (144 posts observed on
      2026-08-12). Paginate with page/per_page and read X-WP-Total / X-WP-TotalPages.
- target: $.paths['/wp-json/effect/v1/glb-positions/{id}'].get
  update:
    x-apievangelist-note: >-
      First-party endpoint storing 3D-model placement for GLB media attachments used by the product
      visualiser. Anonymously reachable; a non-attachment id returns the site's own error code
      `effect_invalid_attachment` with HTTP 404.
- target: $.paths['/wp-json/effect/v1/careers/sync'].post
  update:
    x-apievangelist-note: >-
      First-party job-board synchronisation trigger. Capability-gated — observed HTTP 401
      `rest_forbidden` anonymously. Populates the `career` collection.
- target: $.paths['/wp-json/mcp/mcp-oauth-server'].post
  update:
    x-apievangelist-note: >-
      Live MCP JSON-RPC endpoint. Anonymous tools/list and initialize both return HTTP 401 with a
      correct RFC 9728 Bearer challenge; the tool set requires the `mcp` scope via
      authorization_code + PKCE (S256), with public-client registration by client_id metadata
      document.
- target: $.paths['/wp-json/wp-abilities/v1/abilities'].get
  update:
    x-apievangelist-note: >-
      WordPress Abilities registry — the surface MCP tools are projected from. Gated (HTTP 401
      anonymously), so the ability names and input schemas behind the MCP servers are not publicly
      discoverable.
