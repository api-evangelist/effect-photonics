openapi: 3.1.0
info:
  title: EFFECT Photonics WordPress REST API
  version: wp/v2
  summary: The live WordPress REST API served by the EFFECT Photonics corporate website.
  description: 'Derived verbatim from the route-discovery document the EFFECT Photonics web server publishes at
    https://effectphotonics.com/wp-json/ (fetched 2026-08-12, HTTP 200). Every path, method, parameter name, type,
    default and enum in this document was read from that live response; nothing was invented.


    This is the content-management API of the corporate marketing site, not a product, network-management or optical-transceiver
    API. EFFECT Photonics is an optical-semiconductor company (coherent optical transceivers and monolithically
    integrated InP photonic circuits) and publishes no developer product API, no developer portal and no SDK. The
    surface is catalogued because it is a real, live, self-describing HTTP contract on the provider''s own host,
    because it carries a first-party custom namespace (`effect/v1`), and because the same install exposes two Model
    Context Protocol servers under the `mcp` namespace guarded by an OAuth 2.1 authorization server (see mcp/effect-photonics-mcp.yml).


    Only the WordPress core and first-party namespaces are represented (`wp/v2`, `wp-abilities/v1`, `mcp`, `oembed/1.0`,
    `effect/v1`, and the root index). Third-party plugin namespaces advertised by the same discovery document (akismet/v1,
    litespeed/v1, litespeed/v3, yoast/v1, connector/v1, duplicate-post/v1, wp-site-health/v1, wp-block-editor/v1)
    are intentionally excluded as vendor plugin internals.'
  x-derived-from: https://effectphotonics.com/wp-json/
  x-derived-on: '2026-08-12'
  x-apievangelist-method: derived
servers:
- url: https://effectphotonics.com
  description: Production
tags:
- name: root
  description: REST API index / namespace discovery.
- name: wp/v2
  description: WordPress core content API (posts, pages, media, custom post types, taxonomies, users, settings).
    Public read on published content; writes and privileged reads are capability-gated.
- name: wp-abilities/v1
  description: WordPress Abilities API — the registry of named abilities an agent may discover and run, and the
    surface the MCP adapter projects into tools. Read access is capability-gated (observed HTTP 401 anonymously).
- name: mcp
  description: Model Context Protocol servers exposed by the WordPress MCP adapter. Both servers require authentication
    (observed HTTP 401 anonymously); the OAuth server answers with an RFC 9728 Bearer challenge.
- name: oembed/1.0
  description: oEmbed discovery and proxy endpoints.
- name: effect/v1
  description: EFFECT Photonics' own custom REST namespace — a careers synchronisation trigger and a GLB (3D model)
    position endpoint used by the product visualiser.
