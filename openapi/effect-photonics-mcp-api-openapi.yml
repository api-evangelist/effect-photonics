servers:
- url: https://effectphotonics.com
  description: Production
tags:
- name: MCP
  description: Model Context Protocol servers exposed by the WordPress MCP adapter. Both servers require authentication (observed HTTP 401 anonymously); the OAuth server answers with an RFC 9728 Bearer challenge.
