generated: '2026-08-12'
method: probed
status: published
source: https://effectphotonics.com/wp-json/mcp
summary: EFFECT Photonics' corporate WordPress site exposes two live Model Context Protocol servers under
  the `mcp` REST namespace, guarded by an OAuth 2.1 authorization server the same host advertises via
  RFC 8414 / RFC 9728 metadata. This is a site-CMS MCP surface produced by the WordPress MCP adapter,
  not an optical-transceiver, network-management or product-control server — EFFECT Photonics is an optical-semiconductor
  manufacturer and publishes no developer product API. Both servers were probed anonymously on 2026-08-12
  and both returned HTTP 401, so the live tool set could not be enumerated. No tool list is recorded below
  because none was observed; nothing is inferred.
servers:
- name: mcp-oauth-server
  transport: http
  url: https://effectphotonics.com/wp-json/mcp/mcp-oauth-server
  methods:
  - POST
  - GET
  - DELETE
  auth:
    type: oauth2
    scheme: Bearer
    scopes:
    - mcp
    authorization_server: https://effectphotonics.com
    protected_resource_metadata: https://effectphotonics.com/.well-known/oauth-protected-resource
    authorization_endpoint: https://effectphotonics.com/oauth/authorize
    token_endpoint: https://effectphotonics.com/oauth/token
    revocation_endpoint: https://effectphotonics.com/oauth/revoke
    pkce: S256
    client_registration: client_id_metadata_document
    token_endpoint_auth_methods:
    - none
  probe:
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    body_observed: '{"code":"mcp_unauthorized","message":"MCP authentication required.","data":{"status":401}}'
    www_authenticate: Bearer realm="https://effectphotonics.com", resource_metadata="https://effectphotonics.com/.well-known/oauth-protected-resource"
    note: Correct RFC 9728 challenge behaviour — the 401 names the protected-resource metadata document,
      so a compliant MCP client can discover the authorization server without out-of-band configuration.
      An `initialize` call returns the same 401. The live tool set requires an authenticated tools/list;
      it is not published anonymously.
- name: mcp-adapter-default-server
  transport: http
  url: https://effectphotonics.com/wp-json/mcp/mcp-adapter-default-server
  methods:
  - POST
  - GET
  - DELETE
  auth:
    type: wordpress-capability
    note: Gated by WordPress capability checks rather than by the OAuth challenge; no WWW-Authenticate
      header is returned.
  probe:
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    body_observed: '{"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
tools: []
tools_note: Empty by design. tools/list is auth-gated on both servers, the site publishes no llms.txt
  and no tool documentation, and the WordPress Abilities API registry (/wp-json/wp-abilities/v1/abilities)
  — which is what the MCP adapter projects into tools — also returned HTTP 401 anonymously. Enumerating
  the tool set requires authenticated introspection. Deriving a speculative tool list from the REST surface
  would misrepresent what this server exposes.
related:
  abilities_registry:
    url: https://effectphotonics.com/wp-json/wp-abilities/v1/abilities
    http_status: 401
    note: WordPress Abilities API (wp-abilities/v1) — the named-ability registry the MCP adapter binds
      tools to. Routes are advertised in the public discovery document but read access is gated.
