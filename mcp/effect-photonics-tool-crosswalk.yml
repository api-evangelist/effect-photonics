summary: >-
  EFFECT Photonics runs two live MCP servers and a live REST surface on the same WordPress host, so
  the crosswalk is emitted. It is deliberately empty on the tool side: both MCP servers answer
  tools/list with HTTP 401, the WordPress Abilities registry the adapter projects into tools is also
  401, and the provider publishes no llms.txt or tool documentation. No tool name was ever observed,
  so no row can be bound without inventing one. What IS recorded is the surface topology, the
  auth-gating that blocks enumeration, and the REST operations that exist with no known tool.
