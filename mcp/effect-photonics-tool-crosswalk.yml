    note: >-
      Route discovery is anonymous (HTTP 200). Read operations on published content (wp/v2 posts,
      pages, media, products, careers, events, partners, team, FAQs and the seven product taxonomies)
      are anonymous; write operations and privileged reads are capability-gated.
