  mcp:
    endpoints:
    - https://effectphotonics.com/wp-json/mcp/mcp-oauth-server
    - https://effectphotonics.com/wp-json/mcp/mcp-adapter-default-server
    gated: true
    note: >-
      Both return HTTP 401 to an anonymous tools/list. The OAuth server requires the `mcp` scope via
      authorization_code + PKCE (S256) and answers with an RFC 9728 Bearer challenge. Tool input
      schemas require authenticated introspection.
